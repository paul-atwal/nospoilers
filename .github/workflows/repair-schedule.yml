name: Repair ESPN schedule

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment and isolated AWS table to use
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      game_id:
        description: One durable ESPN game ID (leave empty for a season week)
        required: false
        type: string
      season:
        description: Season year for week scope
        required: false
        type: string
      phase:
        description: Season phase for week scope
        required: false
        type: string
      week:
        description: Week number for week scope
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: nospoil-schedule-repair-${{ github.repository }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  repair:
    name: Repair schedule, then reconcile ratings
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 20
    env:
      GAME_ID: ${{ inputs.game_id || '' }}
      SEASON: ${{ inputs.season || '' }}
      PHASE: ${{ inputs.phase || '' }}
      WEEK: ${{ inputs.week || '' }}
      NOSPOIL_GAMES_TABLE: ${{ vars.NOSPOIL_GAMES_TABLE }}
      NOSPOIL_SCHEDULE_INDEX: ${{ vars.NOSPOIL_SCHEDULE_INDEX }}
      NOSPOIL_OPERATIONS_ROLE_ARN: ${{ vars.NOSPOIL_OPERATIONS_ROLE_ARN }}
      NOSPOIL_AWS_REGION: ${{ vars.NOSPOIL_AWS_REGION }}
      NOSPOIL_ESPN_TIMEOUT_SECONDS: ${{ vars.NOSPOIL_ESPN_TIMEOUT_SECONDS }}
      NOSPOIL_NFLVERSE_TIMEOUT_SECONDS: ${{ vars.NOSPOIL_NFLVERSE_TIMEOUT_SECONDS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/constraints.txt
            backend/requirements-reconcile.in
            backend/requirements-reconcile.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-reconcile.txt

      - name: Validate repair scope and environment
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$NOSPOIL_GAMES_TABLE" ]] || { echo "NOSPOIL_GAMES_TABLE is required" >&2; exit 2; }
          [[ -n "$NOSPOIL_OPERATIONS_ROLE_ARN" ]] || { echo "NOSPOIL_OPERATIONS_ROLE_ARN is required" >&2; exit 2; }
          [[ -n "$NOSPOIL_AWS_REGION" ]] || { echo "NOSPOIL_AWS_REGION is required" >&2; exit 2; }
          if [[ -n "$GAME_ID" ]]; then
            [[ -z "$SEASON$PHASE$WEEK" ]] || { echo "game_id cannot be combined with season, phase, or week" >&2; exit 2; }
            [[ "$GAME_ID" =~ ^[A-Za-z0-9_.:-]+$ ]] || { echo "GAME_ID contains unsupported characters" >&2; exit 2; }
          else
            [[ "$SEASON" =~ ^[1-9][0-9]{3}$ ]] || { echo "SEASON is required for week scope" >&2; exit 2; }
            case "$PHASE" in preseason|regular_season|postseason) ;; *) echo "PHASE is required for week scope" >&2; exit 2 ;; esac
            [[ "$WEEK" =~ ^[1-9][0-9]*$ ]] || { echo "WEEK is required for week scope" >&2; exit 2; }
          fi

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: ${{ vars.NOSPOIL_OPERATIONS_ROLE_ARN }}
          aws-region: ${{ vars.NOSPOIL_AWS_REGION }}
          role-session-name: nospoil-schedule-repair

      - name: Repair ESPN final score
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$GAME_ID" ]]; then
            args+=(--game-id "$GAME_ID")
          else
            args+=(--season "$SEASON" --phase "$PHASE" --week "$WEEK")
          fi
          python -m backend.nospoil_nfl.sync.repair "${args[@]}"

      # Repair must finish successfully before correction reconciliation can
      # consume the durable final score.
      - name: Reconcile corrected rating input
        shell: bash
        env:
          REPAIR_SEASON: ${{ steps.repair.outputs.season }}
          RECONCILIATION_GAME_IDS: ${{ steps.repair.outputs.reconciliation_game_ids }}
        run: |
          set -euo pipefail
          [[ "$REPAIR_SEASON" =~ ^[1-9][0-9]{3}$ ]] || { echo "repair did not return a valid season" >&2; exit 1; }
          jq -e 'type == "array" and all(.[]; type == "string" and length > 0)' <<< "$RECONCILIATION_GAME_IDS" >/dev/null
          args=(--mode correction --season "$REPAIR_SEASON")
          while IFS= read -r game_id; do
            [[ "$game_id" =~ ^[A-Za-z0-9_.:-]+$ ]] || { echo "repair returned an invalid game ID" >&2; exit 1; }
            args+=(--game-id "$game_id")
          done < <(jq -r '.[]' <<< "$RECONCILIATION_GAME_IDS")
          if (( ${#args[@]} == 4 )); then
            echo "No selected games support nflverse rating confirmation."
            exit 0
          fi
          python -m backend.nospoil_nfl.rating.reconcile "${args[@]}"
