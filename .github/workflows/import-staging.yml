name: Import reviewed schedule inventory (staging)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: nospoil-staging-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 90
    env:
      NOSPOIL_GAMES_TABLE: ${{ vars.NOSPOIL_GAMES_TABLE }}
      NOSPOIL_SCHEDULE_INDEX: ${{ vars.NOSPOIL_SCHEDULE_INDEX }}
      NOSPOIL_AWS_REGION: ${{ vars.NOSPOIL_AWS_REGION }}
      NOSPOIL_IMPORT_ROLE_ARN: ${{ vars.NOSPOIL_IMPORT_ROLE_ARN }}
      NOSPOIL_ESPN_TIMEOUT_SECONDS: ${{ vars.NOSPOIL_ESPN_TIMEOUT_SECONDS }}
      NOSPOIL_NFLVERSE_TIMEOUT_SECONDS: ${{ vars.NOSPOIL_NFLVERSE_TIMEOUT_SECONDS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/constraints.in
            backend/constraints.txt
            backend/requirements-sync.in
            backend/requirements-reconcile.in
            backend/requirements-sync.txt
            backend/requirements-reconcile.txt
      - name: Install import and reconciliation dependencies
        run: python -m pip install -r backend/requirements-reconcile.txt

      - name: Validate staging-only configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$NOSPOIL_GAMES_TABLE" == "nospoil-staging-games" ]] || { echo "staging table is required" >&2; exit 2; }
          [[ -n "$NOSPOIL_AWS_REGION" ]] || { echo "AWS region is required" >&2; exit 2; }
          [[ -n "$NOSPOIL_IMPORT_ROLE_ARN" ]] || { echo "staging import role is required" >&2; exit 2; }

      - name: Configure short-lived staging credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: ${{ vars.NOSPOIL_IMPORT_ROLE_ARN }}
          aws-region: ${{ vars.NOSPOIL_AWS_REGION }}
          role-session-name: nospoil-staging-import
      - name: Import every reviewed season, then reconcile captured IDs
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          seasons=(2020 2021 2022 2023 2024 2025 2026)
          import_failures=()
          reconciliation_failures=()

          # Keep this pass import-only. A known source-data correction can fail
          # without preventing the remaining season inventories from loading.
          for season in "${seasons[@]}"; do
            output="$workdir/$season.output"
            : > "$output"
            import_rc=0
            GITHUB_OUTPUT="$output" python -m backend.nospoil_nfl.sync.import_schedule --season "$season" || import_rc=$?
            if (( import_rc != 0 )); then
              import_failures+=("$season (exit $import_rc)")
              continue
            fi
            ids="$(sed -n 's/^supported_final_game_ids=//p' "$output")"
            if ! jq -e 'type == "array" and all(.[]; type == "string" and test("^[A-Za-z0-9._:-]+$"))' <<< "$ids" >/dev/null; then
              import_failures+=("$season (invalid supported_final_game_ids)")
              continue
            fi
            printf '%s\n' "$ids" > "$workdir/$season.ids"
          done

          # Reconcile only after all seven imports have had a chance to run.
          for season in "${seasons[@]}"; do
            ids_file="$workdir/$season.ids"
            [[ -f "$ids_file" ]] || continue
            ids="$(<"$ids_file")"
            if [[ "$ids" == "[]" ]]; then
              echo "No supported final IDs for $season; skipping reconciliation."
              continue
            fi
            game_ids=()
            while IFS= read -r game_id; do
              game_ids+=("$game_id")
            done < <(jq -r '.[]' <<< "$ids")
            reconcile_args=(--mode correction --season "$season")
            for game_id in "${game_ids[@]}"; do
              reconcile_args+=(--game-id "$game_id")
            done
            reconcile_rc=0
            python -m backend.nospoil_nfl.rating.reconcile "${reconcile_args[@]}" || reconcile_rc=$?
            if (( reconcile_rc != 0 )); then
              reconciliation_failures+=("$season (exit $reconcile_rc)")
            fi
          done

          if (( ${#import_failures[@]} || ${#reconciliation_failures[@]} )); then
            echo "Staging inventory completed with attention required."
            if (( ${#import_failures[@]} )); then
              printf 'Import failures: %s\n' "${import_failures[*]}"
            fi
            if (( ${#reconciliation_failures[@]} )); then
              printf 'Reconciliation failures: %s\n' "${reconciliation_failures[*]}"
            fi
            exit 1
          fi
