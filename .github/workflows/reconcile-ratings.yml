name: Reconcile nflverse ratings

on:
  schedule:
    # Every six hours, away from the top of the hour to reduce scheduler delay risk.
    - cron: "37 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: true
        default: due
        type: choice
        options:
          - due
          - correction
          - verify
      season:
        description: NFL season year; empty uses the active season
        required: false
        type: string
      game_id:
        description: One final ESPN game ID for a targeted correction
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: nflverse-reconciliation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile ratings
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    env:
      MODE: ${{ inputs.mode || 'due' }}
      SEASON: ${{ inputs.season || '' }}
      GAME_ID: ${{ inputs.game_id || '' }}
      NOSPOIL_GAMES_TABLE: ${{ vars.NOSPOIL_GAMES_TABLE }}
      NOSPOIL_SCHEDULE_INDEX: ${{ vars.NOSPOIL_SCHEDULE_INDEX }}
      NOSPOIL_RECONCILE_ROLE_ARN: ${{ vars.NOSPOIL_RECONCILE_ROLE_ARN }}
      NOSPOIL_AWS_REGION: ${{ vars.NOSPOIL_AWS_REGION }}
      NOSPOIL_NFLVERSE_TIMEOUT_SECONDS: ${{ vars.NOSPOIL_NFLVERSE_TIMEOUT_SECONDS }}
    steps:
      # v4, pinned to 11d5960a326750d5838078e36cf38b85af677262.
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      # v5, pinned to a26af69be951a213d495a4c3e4e4022e16d87065.
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Validate reconciliation configuration
        shell: bash
        run: |
          set -euo pipefail
          case "$MODE" in
            due|correction|verify) ;;
            *) echo "MODE must be due, correction, or verify" >&2; exit 2 ;;
          esac
          if [[ -n "$SEASON" && ! "$SEASON" =~ ^[1-9][0-9]*$ ]]; then
            echo "SEASON must be a positive integer" >&2
            exit 2
          fi
          if [[ "$MODE" != correction && -n "$GAME_ID" ]]; then
            echo "GAME_ID is allowed only for correction mode" >&2
            exit 2
          fi
          if [[ "$MODE" != verify ]]; then
            [[ -n "$NOSPOIL_GAMES_TABLE" ]] || { echo "NOSPOIL_GAMES_TABLE is required" >&2; exit 2; }
            [[ -n "$NOSPOIL_RECONCILE_ROLE_ARN" ]] || { echo "NOSPOIL_RECONCILE_ROLE_ARN is required" >&2; exit 2; }
            [[ -n "$NOSPOIL_AWS_REGION" ]] || { echo "NOSPOIL_AWS_REGION is required" >&2; exit 2; }
          fi

      # v6, pinned to cbe3b392738ccf3f987d68400dafcf4b0624a56c.
      - name: Configure short-lived AWS credentials
        if: env.MODE != 'verify'
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: ${{ vars.NOSPOIL_RECONCILE_ROLE_ARN }}
          aws-region: ${{ vars.NOSPOIL_AWS_REGION }}
          role-session-name: nospoil-nflverse-reconciliation

      - name: Run reconciliation
        shell: bash
        run: |
          set -euo pipefail
          args=(--mode "$MODE")
          if [[ -n "$SEASON" ]]; then args+=(--season "$SEASON"); fi
          if [[ -n "$GAME_ID" ]]; then args+=(--game-id "$GAME_ID"); fi
          python -m backend.nospoil_nfl.rating.reconcile "${args[@]}"
