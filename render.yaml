# Render Blueprint - static site only; publication is intentionally manual during D1.
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: nospoilers-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    autoDeploy: false
