<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">C2 before: compatibility game mapping leaves presentation rules in components</title>
  <desc id="desc">App maps API games into legacy Game fields. GameCard calculates rating, record selection, winner styling, score visibility, and odds presentation. Team logos are absent after direct ESPN requests are removed.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6Z" fill="#26384a"/></marker><style>text{font-family:Arial,sans-serif;fill:#14213d}.t{font-size:26px;font-weight:700}.h{font-size:17px;font-weight:700}.b{font-size:14px}.n{fill:#eef6ff;stroke:#245ea8;stroke-width:2}.w{fill:#fff0f0;stroke:#a61b1b;stroke-width:2}.l{stroke:#26384a;stroke-width:2.3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="760" fill="#fff"/><text x="45" y="50" class="t">Before C2 — transport migrated, display contract still legacy</text>
  <rect x="55" y="120" width="280" height="165" rx="12" class="n"/><text x="80" y="158" class="h">App.tsx / toViewGame()</text><text x="80" y="190" class="b">ApiGame → legacy Game</text><text x="80" y="218" class="b">nullable score compatibility</text><text x="80" y="246" class="b">rating score/null + isEstimated</text>
  <rect x="455" y="95" width="320" height="220" rx="12" class="n"/><text x="480" y="135" class="h">components/GameCard.tsx</text><text x="480" y="167" class="b">select pre/post record on reveal</text><text x="480" y="195" class="b">derive winners from score</text><text x="480" y="223" class="b">infer pending/missing from null/-1</text><text x="480" y="251" class="b">parse odds + choose labels</text><text x="480" y="279" class="b">local boolean reveal state</text>
  <rect x="895" y="120" width="250" height="165" rx="12" class="w"/><text x="920" y="158" class="h">Presentation gaps</text><text x="920" y="190" class="b">no local logos</text><text x="920" y="218" class="b">rating states conflated</text><text x="920" y="246" class="b">timezone/focus unclear</text>
  <path d="M335 202L455 202" class="l"/><text x="360" y="185" class="b">legacy fields</text><path d="M775 202L895 202" class="l"/>
  <rect x="55" y="440" width="1090" height="190" rx="12" class="w"/><text x="80" y="482" class="h">Spoiler/fallback risk surface</text><text x="80" y="520" class="b">Reveal state is boolean rather than game identity; component reuse can carry a reveal to another game.</text><text x="80" y="552" class="b">Missing pregame/postgame shapes cannot stay independent; card owns domain selection instead of display-ready values.</text><text x="80" y="584" class="b">No explicit local-asset failure branch; optional kickoff and rating states do not have complete accessible labels.</text>
</svg>

