<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="840" viewBox="0 0 1260 840" role="img" aria-labelledby="title desc">
  <title id="title">C2 after: display-ready mapping and spoiler-safe card rendering</title>
  <desc id="desc">App preserves API order and selects eligible season games. A game view-model mapper formats kickoff, records, rating, score, and local logos. Header and GameCard render accessible controls and spoiler-safe values with explicit fallback branches.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6Z" fill="#26384a"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6Z" fill="#a61b1b"/></marker><style>text{font-family:Arial,sans-serif;fill:#14213d}.t{font-size:26px;font-weight:700}.h{font-size:17px;font-weight:700}.b{font-size:14px}.n{fill:#eef6ff;stroke:#245ea8;stroke-width:2}.s{fill:#effaf2;stroke:#24733f;stroke-width:2}.e{fill:#fff0f0;stroke:#a61b1b;stroke-width:2}.l{stroke:#26384a;stroke-width:2.3;fill:none;marker-end:url(#a)}.d{stroke:#a61b1b;stroke-width:2.3;stroke-dasharray:8 6;fill:none;marker-end:url(#r)}</style></defs>
  <rect width="1260" height="840" fill="#fff"/><text x="45" y="50" class="t">After C2 — display-ready values with explicit spoiler-safe fallbacks</text>
  <rect x="45" y="110" width="260" height="185" rx="12" class="n"/><text x="70" y="150" class="h">App.tsx</text><text x="70" y="182" class="b">weekly: preserve API order</text><text x="70" y="210" class="b">season: final + rated + scope</text><text x="70" y="238" class="b">take first 10 in API order</text><text x="70" y="266" class="b">pass stale/error separately</text>
  <rect x="390" y="85" width="360" height="235" rx="12" class="n"/><text x="415" y="125" class="h">services/gameViewModel.ts</text><text x="415" y="157" class="b">mapApiGame(game, timeZone)</text><text x="415" y="185" class="b">score?: { home, away }</text><text x="415" y="213" class="b">pregame/postgame display records</text><text x="415" y="241" class="b">rating { state, score, label }</text><text x="415" y="269" class="b">kickoff label with zone / TBD</text><text x="415" y="297" class="b">team text + local logo URL</text>
  <rect x="835" y="95" width="360" height="210" rx="12" class="s"/><text x="860" y="135" class="h">services/teamAssets.ts</text><text x="860" y="167" class="b">TEAM_ASSET_MAP_V1[stable identity]</text><text x="860" y="195" class="b">/team-logos/*.png (bundled)</text><text x="860" y="223" class="b">unknown → abbreviation/name text</text><text x="860" y="251" class="b">image error → same text fallback</text><text x="860" y="279" class="b">provenance.md records sources</text>
  <path d="M305 202L390 202" class="l"/><text x="310" y="184" class="b">ApiGame</text><path d="M750 202L835 202" class="l"/><text x="765" y="184" class="b">logo key/id</text>
  <rect x="120" y="455" width="390" height="235" rx="12" class="n"/><text x="145" y="495" class="h">components/GameCard.tsx</text><text x="145" y="527" class="b">revealedGameId === game.id</text><text x="145" y="555" class="b">hidden: no score/winner/result aria</text><text x="145" y="583" class="b">revealed: update same-game score</text><text x="145" y="611" class="b">render explicit rating state</text><text x="145" y="639" class="b">native reveal + focus-visible ring</text><text x="145" y="667" class="b">render display values only</text>
  <rect x="665" y="455" width="390" height="235" rx="12" class="n"/><text x="690" y="495" class="h">components/Header.tsx</text><text x="690" y="527" class="b">native previous/next/view buttons</text><text x="690" y="555" class="b">descriptive labels + pressed state</text><text x="690" y="583" class="b">disabled catalogue ends</text><text x="690" y="611" class="b">visible focus-visible rings</text><text x="690" y="639" class="b">no result content in status text</text>
  <path d="M500 320C470 370 395 405 335 455" class="l"/><text x="330" y="392" class="b">display-ready game</text><path d="M600 320C650 375 760 405 820 455" class="l"/><text x="650" y="392" class="b">week/view labels</text>
  <rect x="1080" y="455" width="150" height="235" rx="12" class="e"/><text x="1098" y="495" class="h">Fallbacks</text><text x="1098" y="530" class="b">no score</text><text x="1098" y="558" class="b">no record</text><text x="1098" y="586" class="b">no kickoff</text><text x="1098" y="614" class="b">no logo</text><text x="1098" y="642" class="b">pending /</text><text x="1098" y="664" class="b">unavailable</text>
  <path d="M1055 570L1080 570" class="d"/>
  <text x="45" y="790" class="h">No component source calculations • No remote images • No hidden-result announcements</text>
</svg>
