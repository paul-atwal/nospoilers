<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">C1 after: owned read API request lifecycle</title>
  <desc id="desc">App request owners call a typed read API client for bootstrap, a selected week, or the active season. Per-resource caches retain bodies and ETags. Abort and generation checks prevent stale commits, while polling and bounded retry schedule later refreshes.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#26384a"/></marker><marker id="redarrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#a61b1b"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#14213d}.title{font-size:28px;font-weight:700}.section{font-size:19px;font-weight:700}.label{font-size:16px;font-weight:700}.body{font-size:14px}.node{fill:#eef6ff;stroke:#245ea8;stroke-width:2}.state{fill:#effaf2;stroke:#24733f;stroke-width:2}.external{fill:#fff8e6;stroke:#9a6700;stroke-width:2}.error{fill:#fff0f0;stroke:#a61b1b;stroke-width:2}.line{stroke:#26384a;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:8 6}.red{stroke:#a61b1b;marker-end:url(#redarrow)}.muted{fill:#465a70}</style></defs>
  <rect width="1500" height="980" fill="#ffffff"/>
  <text x="48" y="52" class="title">After C1 — one typed read path with explicit request ownership</text>
  <text x="60" y="105" class="section">React ownership</text>
  <rect x="60" y="130" width="330" height="190" rx="12" class="node"/><text x="85" y="170" class="label">App.tsx request owners</text><text x="85" y="200" class="body">bootstrapOwner</text><text x="85" y="226" class="body">weeklyOwner(selectedWeek)</text><text x="85" y="252" class="body">seasonOwner(activeSeason)</text><text x="85" y="278" class="body">AbortController + generation</text>
  <rect x="60" y="400" width="330" height="180" rx="12" class="state"/><text x="85" y="440" class="label">Independent page state</text><text x="85" y="470" class="body">sourceCurrentWeek + knownWeeks</text><text x="85" y="496" class="body">selectedWeek + viewMode</text><text x="85" y="522" class="body">data + stale/error/loading</text><text x="85" y="548" class="body">catalogue-end navigation flags</text>
  <text x="505" y="105" class="section">Transport and cache</text>
  <rect x="500" y="130" width="365" height="190" rx="12" class="node"/><text x="525" y="170" class="label">services/readApi.ts</text><text x="525" y="200" class="body">fetchBootstrap(signal)</text><text x="525" y="226" class="body">fetchWeekSnapshot(key, signal)</text><text x="525" y="252" class="body">fetchSeasonSnapshot(season, signal)</text><text x="525" y="278" class="body">decode + Retry-After + URL contract</text>
  <rect x="500" y="400" width="365" height="180" rx="12" class="state"/><text x="525" y="440" class="label">Exact-resource cache</text><text x="525" y="470" class="body">key = full endpoint/selection</text><text x="525" y="496" class="body">{ ETag, retained body }</text><text x="525" y="522" class="body">304 → reuse body + poll advice</text><text x="525" y="548" class="body">cacheless 304 → unconditional GET</text>
  <text x="985" y="105" class="section">Prepared backend</text>
  <rect x="980" y="130" width="445" height="240" rx="12" class="external"/><text x="1005" y="170" class="label">FastAPI read service :8001</text><text x="1005" y="205" class="body">GET /api/v1/bootstrap</text><text x="1005" y="235" class="body">GET /api/v1/weeks/{season}/{phase}/{week}</text><text x="1005" y="265" class="body">GET /api/v1/seasons/{activeSeason}</text><text x="1005" y="305" class="body">complete games + rating state + freshness</text><text x="1005" y="331" class="body">ETag + pollAfterSeconds + Retry-After</text>
  <path d="M390 210 L500 210" class="line"/><text x="410" y="193" class="body">latest refresh</text>
  <path d="M865 220 L980 220" class="line"/><text x="880" y="202" class="body">If-None-Match</text>
  <path d="M980 285 C930 330 915 430 865 470" class="line"/><text x="890" y="390" class="body">200/304</text>
  <path d="M500 500 L390 500" class="line"/><text x="405" y="485" class="body">retained body</text>
  <path d="M225 320 L225 400" class="line"/><text x="242" y="365" class="body">commit only current generation</text>
  <rect x="500" y="685" width="365" height="175" rx="12" class="error"/><text x="525" y="725" class="label">Failure branch</text><text x="525" y="756" class="body">429 / 503 / network</text><text x="525" y="782" class="body">honor valid Retry-After, bounded delay</text><text x="525" y="808" class="body">retain data; expose stale/error</text><text x="525" y="834" class="body">abort is silent</text>
  <rect x="60" y="685" width="330" height="175" rx="12" class="state"/><text x="85" y="725" class="label">Refresh triggers</text><text x="85" y="756" class="body">envelope pollAfterSeconds</text><text x="85" y="782" class="body">manual retry</text><text x="85" y="808" class="body">coalesced focus/visibility return</text><text x="85" y="834" class="body">null stops timer only</text>
  <path d="M225 685 C225 630 290 620 330 580" class="line dash"/><text x="80" y="635" class="body">one non-overlapping loop</text>
  <path d="M682 685 L682 580" class="line red"/><text x="700" y="640" class="body">retry refresh</text>
  <path d="M980 330 C905 500 950 700 865 750" class="line red dash"/><text x="980" y="610" class="body">429/503/error</text>
  <path d="M390 270 C455 340 430 705 500 745" class="line red dash"/><text x="270" y="650" class="body">new selection aborts old owner</text>
  <text x="980" y="760" class="label">No active browser calls to ESPN</text><text x="980" y="790" class="body muted">No per-game rating calls; no client source calculations.</text>
</svg>
